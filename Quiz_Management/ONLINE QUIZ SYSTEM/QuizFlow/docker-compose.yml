# QuizFlow Production Horizontal Scaling Stack
# Architecture:
#   Client -> Nginx LB (port 80) -> Stateless FastAPI Instances (api-1, api-2)
#                                      |-> PgBouncer -> PostgreSQL 16
#                                      |-> Redis 7 (Shared Cache + Rate Limiting + Celery Broker)
#                                      |-> Celery Worker (Background Exports & Analytics)
#
# Usage:
#   cp backend/.env.production.example .env.prod
#   # Edit .env.prod with strong passwords & SECRET_KEY
#   docker compose --env-file .env.prod up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quizflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env}
      POSTGRES_DB: ${POSTGRES_DB:-quizflow}
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "wal_buffers=16MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizflow} -d ${POSTGRES_DB:-quizflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_USER: ${POSTGRES_USER:-quizflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in env}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-quizflow}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 10
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api-1: &api-service
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in env}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-quizflow}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-quizflow}
      DB_USE_NULL_POOL: "True"
      DB_POOL_PRE_PING: "True"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      WORKERS: ${WORKERS:-4}
      LOG_FORMAT: json
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000"]}
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-2:
    <<: *api-service

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in env}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-quizflow}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB:-quizflow}
      DB_USE_NULL_POOL: "True"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOG_FORMAT: json
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

volumes:
  postgres_data:
