; PgBouncer Reference Configuration for QuizFlow High-Concurrency PostgreSQL Deployments
; Place alongside userlist.txt when deploying standalone PgBouncer (Docker Compose uses env vars directly).

[databases]
quizflow = host=postgres port=5432 dbname=quizflow

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling multiplexes hundreds/thousands of FastAPI connections onto a small DB pool
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 3

server_reset_query = DISCARD ALL
server_idle_timeout = 300
query_timeout = 30
client_idle_timeout = 120
ignore_startup_parameters = extra_float_digits
