# QuizFlow Nginx Reverse Proxy & Load Balancer Configuration
# Distributes traffic across stateless FastAPI backend instances with least_conn balancing.

upstream quizflow_api {
    least_conn;
    server api-1:8000 max_fails=3 fail_timeout=15s;
    server api-2:8000 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    keepalive_timeout 65;

    # Compression
    gzip on;
    gzip_types application/json text/csv text/plain;
    gzip_min_length 1024;

    # Health & Readiness pass-through
    location ~ ^/(health|ready)$ {
        proxy_pass http://quizflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://quizflow_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}
